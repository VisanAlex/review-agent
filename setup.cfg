[metadata]
name = review-agent-orchestrator
version = 0.5.2
description = A portable skill and helper for host-orchestrated specialist code reviews
long_description = file: README.md
long_description_content_type = text/markdown
author = Alex Visan
license = MIT
license_files = LICENSE
url = https://github.com/VisanAlex/review-agent
project_urls =
    Repository = https://github.com/VisanAlex/review-agent
    Issues = https://github.com/VisanAlex/review-agent/issues

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
review_agent =
    skill_template/review-agent/*.md
    skill_template/review-agent/agents/*.yaml
    skill_template/review-agent/references/*.md

[options.entry_points]
console_scripts =
    review-agent = review_agent.cli:entrypoint
