name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --editable .
      - name: Check marketplace skill synchronization
        run: python scripts/sync_plugin_skill.py --check
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        if: matrix.python-version == '3.13'
        run: python -m pip wheel . --no-deps --wheel-dir dist

  legacy-package:
    name: Ubuntu pip 22 compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install legacy build frontend
        run: python -m pip install "pip==22.0.2" "setuptools==59.6.0" wheel
      - name: Build through the legacy metadata path
        run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
      - name: Install and verify the helper
        run: |
          python -m pip install --no-deps dist/review_agent_orchestrator-*.whl
          review-agent --version
          export HOME="$RUNNER_TEMP/review-agent-home"
          review-agent install-skills --target codex
          test -f "$HOME/.agents/skills/review-agent/references/external-reviewers.md"
